# Production compose — baut das prod-Stage-Image und startet den Nitro-Server.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up --build -d
#   docker compose -f docker-compose.prod.yml logs -f
#
# Unterschied zu dev:
#   - Image-Target `prod` statt `dev` (kein pnpm dev, kein HMR).
#   - Kein Source-Bind-Mount; nur Runtime-Daten werden reingereicht.

services:
  specifyr:
    build:
      context: .
      target: prod
    image: specifyr:prod
    container_name: specifyr-prod
    restart: unless-stopped
    ports:
      - "${SPECIFYR_PORT:-10000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
      SPECIFYR_DATA_DIR: /data
      # AES-256-GCM master key for the encrypted per-project git PAT
      # (project_secrets in the per-org schema). Mandatory in prod.
      SPECIFYR_SECRET_KEY: ${SPECIFYR_SECRET_KEY:?SPECIFYR_SECRET_KEY required — generate with `openssl rand -hex 32`}
    volumes:
      - specifyr_data:/data
    networks:
      default:
        aliases:
          - specifyr
    user: "${UID:-1000}:${GID:-1000}"

volumes:
  specifyr_data:
